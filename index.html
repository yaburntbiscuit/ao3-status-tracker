<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AO3 Status Tracker</title>

<!-- This makes the page feel more "app-like" when added to an iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AO3 Tracker" />

<style>
  :root {
    --ao3-red: #900;
    --ao3-red-dark: #700;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: #f7f7f7;
    color: #222;
    min-height: 100vh;
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* Tab switcher between "Log" and "Check" modes */
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #ccc;
  }

  .tab-button {
    flex: 1;
    padding: 12px;
    background-color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #666;
  }

  .tab-button.active {
    background-color: var(--ao3-red);
    color: #fff;
  }

  .panel {
    background-color: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .panel.hidden {
    display: none;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-top: 14px;
    margin-bottom: 4px;
  }

  input[type="text"],
  input[type="url"],
  select,
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
    background-color: #fff;
    color: #222;
  }

  textarea {
    resize: vertical;
  }

  button.primary {
    margin-top: 18px;
    width: 100%;
    background-color: var(--ao3-red);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button.primary:hover {
    background-color: var(--ao3-red-dark);
  }

  #log-status-msg,
  #check-status-msg {
    margin-top: 12px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }

  #check-result {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    display: none;
  }

  #check-result.found {
    display: block;
    background-color: rgba(66, 133, 244, 0.08);
    border-left: 4px solid #4285f4;
  }

  #check-result.found.dnf {
    background-color: rgba(153, 0, 0, 0.08);
    border-left: 4px solid #900;
  }

  #check-result.found.finished {
    background-color: rgba(52, 168, 83, 0.08);
    border-left: 4px solid #34a853;
  }

  #check-result.not-found {
    display: block;
    background-color: #f0f0f0;
    border-left: 4px solid #999;
    color: #666;
  }

  #check-result p {
    margin: 4px 0;
    font-size: 14px;
  }

  #check-result .result-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .field-wrapper.hidden {
    display: none;
  }
</style>
</head>
<body>

<h1>AO3 Status Tracker</h1>
<p class="subtitle">Log or check your reading status, from anywhere.</p>

<div class="tabs">
  <button class="tab-button active" id="tab-log-btn">Log a fic</button>
  <button class="tab-button" id="tab-check-btn">Check a fic</button>
</div>

<!-- LOG PANEL -->
<div class="panel" id="log-panel">
  <label for="log-url">AO3 fic URL</label>
  <input type="url" id="log-url" placeholder="https://archiveofourown.org/works/12345678" />

  <label for="log-status">Status</label>
  <select id="log-status">
    <option value="reading">Reading</option>
    <option value="finished">Finished</option>
    <option value="dnf">Did Not Finish</option>
  </select>

  <div class="field-wrapper hidden" id="log-reason-wrapper">
    <label for="log-reason">Reason for DNF</label>
    <select id="log-reason">
      <option value="ooc">Out of character</option>
      <option value="pacing">Pacing / dragging</option>
      <option value="plot">Plot / premise didn't work</option>
      <option value="writing">Writing style</option>
      <option value="squick">Squick / content</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="field-wrapper hidden" id="log-chapter-wrapper">
    <label for="log-chapter">Chapter / where you left off</label>
    <input type="text" id="log-chapter" placeholder="e.g. Chapter 4 of 12" />
  </div>

  <label for="log-note">Note (private)</label>
  <textarea id="log-note" rows="4" placeholder="e.g. stopped at chapter 3, felt too slow"></textarea>

  <button class="primary" id="log-save-btn">Save</button>
  <div id="log-status-msg"></div>
</div>

<!-- CHECK PANEL -->
<div class="panel hidden" id="check-panel">
  <label for="check-url">AO3 fic URL</label>
  <input type="url" id="check-url" placeholder="https://archiveofourown.org/works/12345678" />

  <button class="primary" id="check-btn">Check status</button>
  <div id="check-status-msg"></div>

  <div id="check-result"></div>
</div>

<script>
  // ---------------------------------------------------------
  // PASTE YOUR SUPABASE CREDENTIALS BELOW
  // (same ones used in the browser extension's config.js)
  // ---------------------------------------------------------
  const SUPABASE_URL = "https://dhnniwvpwauurhianeqv.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRobm5pd3Zwd2F1dXJoaWFuZXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDkxNzIsImV4cCI6MjEwMDkyNTE3Mn0.GIClijA9Gw-X1ivWnGO-qrvp1YH3PI62YuuXQsRIvls";
  const SUPABASE_TABLE = "tracked_fics";

  const DNF_REASONS = {
    ooc: "Out of character",
    pacing: "Pacing / dragging",
    plot: "Plot / premise didn't work",
    writing: "Writing style",
    squick: "Squick / content",
    other: "Other"
  };

  /**
   * Pulls the fic ID out of any AO3 work URL, same logic as
   * the browser extension uses.
   */
  function getFicIdFromUrl(url) {
    const match = url.match(/\/works\/(\d+)/);
    return match ? match[1] : null;
  }

  // ---------- TAB SWITCHING ----------

  const tabLogBtn = document.getElementById("tab-log-btn");
  const tabCheckBtn = document.getElementById("tab-check-btn");
  const logPanel = document.getElementById("log-panel");
  const checkPanel = document.getElementById("check-panel");

  tabLogBtn.addEventListener("click", () => {
    tabLogBtn.classList.add("active");
    tabCheckBtn.classList.remove("active");
    logPanel.classList.remove("hidden");
    checkPanel.classList.add("hidden");
  });

  tabCheckBtn.addEventListener("click", () => {
    tabCheckBtn.classList.add("active");
    tabLogBtn.classList.remove("active");
    checkPanel.classList.remove("hidden");
    logPanel.classList.add("hidden");
  });

  // ---------- LOG PANEL LOGIC ----------

  const logStatusSelect = document.getElementById("log-status");
  const logReasonWrapper = document.getElementById("log-reason-wrapper");
  const logChapterWrapper = document.getElementById("log-chapter-wrapper");

  function updateLogFieldVisibility() {
    logReasonWrapper.classList.toggle("hidden", logStatusSelect.value !== "dnf");
    logChapterWrapper.classList.toggle("hidden", logStatusSelect.value !== "reading");
  }
  updateLogFieldVisibility();
  logStatusSelect.addEventListener("change", updateLogFieldVisibility);

  document.getElementById("log-save-btn").addEventListener("click", async () => {
    const msg = document.getElementById("log-status-msg");
    const urlInput = document.getElementById("log-url").value.trim();
    const ficId = getFicIdFromUrl(urlInput);

    if (!ficId) {
      msg.textContent = "That doesn't look like a valid AO3 work URL.";
      msg.style.color = "#900";
      return;
    }

    const status = logStatusSelect.value;
    const reason = status === "dnf" ? document.getElementById("log-reason").value : null;
    const chapterProgress = status === "reading" ? document.getElementById("log-chapter").value : null;
    const note = document.getElementById("log-note").value;

    msg.style.color = "#555";
    msg.textContent = "Saving...";

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=fic_id`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates,return=representation"
        },
        body: JSON.stringify([{
          fic_id: ficId,
          title: null, // mobile page doesn't scrape the title; extension fills this in when you visit the fic on desktop
          status: status,
          reason: reason || null,
          note: note || null,
          chapter_progress: chapterProgress || null,
          updated_at: new Date().toISOString()
        }])
      });

      if (!response.ok) {
        const errText = await response.text();
        console.error("Save failed:", errText);
        msg.style.color = "#900";
        msg.textContent = "Something went wrong — try again.";
        return;
      }

      msg.style.color = "#34a853";
      msg.textContent = "Saved!";
    } catch (err) {
      console.error(err);
      msg.style.color = "#900";
      msg.textContent = "Something went wrong — check your connection.";
    }
  });

  // ---------- CHECK PANEL LOGIC ----------

  document.getElementById("check-btn").addEventListener("click", async () => {
    const msg = document.getElementById("check-status-msg");
    const resultBox = document.getElementById("check-result");
    const urlInput = document.getElementById("check-url").value.trim();
    const ficId = getFicIdFromUrl(urlInput);

    resultBox.className = "";
    resultBox.innerHTML = "";

    if (!ficId) {
      msg.textContent = "That doesn't look like a valid AO3 work URL.";
      msg.style.color = "#900";
      return;
    }

    msg.style.color = "#555";
    msg.textContent = "Checking...";

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?fic_id=eq.${ficId}&select=*`,
        {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );

      if (!response.ok) {
        msg.style.color = "#900";
        msg.textContent = "Something went wrong — try again.";
        return;
      }

      const rows = await response.json();
      msg.textContent = "";

      if (rows.length === 0) {
        resultBox.className = "not-found";
        resultBox.innerHTML = `<p>You haven't logged a status for this fic yet.</p>`;
        return;
      }

      const data = rows[0];
      resultBox.className = `found ${data.status}`;

      let html = `<div class="result-title">Status: ${data.status}</div>`;
      if (data.status === "dnf" && data.reason) {
        html += `<p><strong>Reason:</strong> ${DNF_REASONS[data.reason] || data.reason}</p>`;
      }
      if (data.status === "reading" && data.chapter_progress) {
        html += `<p><strong>Left off:</strong> ${data.chapter_progress}</p>`;
      }
      if (data.note) {
        html += `<p><strong>Note:</strong> ${data.note}</p>`;
      }

      resultBox.innerHTML = html;
    } catch (err) {
      console.error(err);
      msg.style.color = "#900";
      msg.textContent = "Something went wrong — check your connection.";
    }
  });
</script>

</body>
</html>
